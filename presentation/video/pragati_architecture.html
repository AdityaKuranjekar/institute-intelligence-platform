<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pragati architecture</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}
  .node rect{fill:#0b0b0b;stroke:#fff;stroke-opacity:.55;stroke-width:1.3;transition:all .25s}
  .node .t{fill:#fff;font-size:17px;font-weight:600}
  .node .s{fill:#fff;fill-opacity:.55;font-size:12px}
  .node{cursor:pointer;transition:opacity .25s}
  .node:hover rect{stroke-opacity:1;stroke-width:2.2}
  .link{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:1.4;transition:all .25s}
  .link.on{stroke-opacity:1;stroke-width:2.4}
  .dim{opacity:.2}
  .col{font-size:12px;letter-spacing:.22em;fill:#fff;fill-opacity:.45;font-weight:600}
  #cap{font-size:15px;fill:#fff;fill-opacity:.85}
  .ring{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:2 8;transform-origin:520px 345px;animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pragati architecture: data in, core, four modules, four outputs">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="#000"/>
  <text x="60" y="64" font-size="26" font-weight="700" fill="#fff">How Pragati works</text>
  <text x="60" y="90" font-size="14" fill="#fff" fill-opacity=".55">Data goes in on the left, safe answers come out on the right.</text>

  <text x="170" y="150" class="col" text-anchor="middle">CAPTURE</text>
  <text x="520" y="150" class="col" text-anchor="middle">CORE</text>
  <text x="840" y="150" class="col" text-anchor="middle">INTELLIGENCE</text>
  <text x="1130" y="150" class="col" text-anchor="middle">WHO SEES IT</text>

  <g id="links"></g>
  <g id="dots"></g>

  <circle class="ring" cx="520" cy="345" r="86"/>
  <g id="hub" class="node" data-id="core">
    <circle cx="520" cy="345" r="62" fill="#fff"/>
    <text x="520" y="341" text-anchor="middle" font-size="18" font-weight="700" fill="#000">Pragati</text>
    <text x="520" y="362" text-anchor="middle" font-size="13" fill="#000" fill-opacity=".7">core</text>
  </g>
  <g id="nodes"></g>

  <line x1="60" y1="610" x2="1220" y2="610" stroke="#fff" stroke-opacity=".18"/>
  <g id="trust"></g>
  <text id="cap" x="640" y="690" text-anchor="middle">Hover any block to follow its data.</text>
</svg>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  var Y=[200,295,395,490];
  var N=[
    {id:"data",x:170,y:345,w:200,h:84,t:"Your data",s:"OMR photo · Excel · WhatsApp",i:"Institutes already hold this data. A phone photo of the answer sheet or last year's Excel is enough to start; it works offline and syncs later."},
    {id:"mas",x:840,y:Y[0],w:230,h:66,t:"Topic mastery",s:"Which topics each student is weak in",i:"A student-by-topic map that says how sure it is, and says 'not enough data' when unsure."},
    {id:"ew",x:840,y:Y[1],w:230,h:66,t:"Early warning",s:"Who needs a call this week",i:"A short weekly list sized to mentor capacity, with plain reasons. Under-18s get plain rules where the law asks."},
    {id:"pc",x:840,y:Y[2],w:230,h:66,t:"Percentile range",s:"An honest range, not a rank",i:"A predicted range (80% target) instead of one number or a rank promise."},
    {id:"rep",x:840,y:Y[3],w:230,h:66,t:"Parent report",s:"Every number checked",i:"Hindi or English message where every number is checked before it is sent; a safe template goes out if any check fails."},
    {id:"o1",x:1130,y:Y[0],w:200,h:66,t:"Teacher",s:"Topic heatmap",i:"Sees weak topics for the whole batch. No ranking of students."},
    {id:"o2",x:1130,y:Y[1],w:200,h:66,t:"Mentor / owner",s:"Weekly list, results",i:"Gets who to call, why, and what to offer; the owner sees what works."},
    {id:"o3",x:1130,y:Y[2],w:200,h:66,t:"Student",s:"Own progress and plan",i:"Own mastery, a study plan and a range. Effort-based, no leaderboards."},
    {id:"o4",x:1130,y:Y[3],w:200,h:66,t:"Parent on WhatsApp",s:"Hindi or English",i:"Monthly update with consent; no comparison with other children."}
  ];
  var T=["Each institute's data stays its own","No consent, no model","Works without internet","Only question difficulty is shared"];
  var by={};N.forEach(function(n){by[n.id]=n});
  by.core={id:"core",x:520,y:345,r:62,t:"Pragati core",i:"One secure core serves every screen. Every table is isolated per institute (row-level security)."};
  var L=[["data","core"],["core","mas"],["core","ew"],["core","pc"],["core","rep"],["mas","o1"],["ew","o2"],["pc","o3"],["rep","o4"]];
  var gL=document.getElementById("links"),gD=document.getElementById("dots"),gN=document.getElementById("nodes");
  var links=[];
  L.forEach(function(l,k){
    var a=by[l[0]],b=by[l[1]];
    var sx=a.r?a.x+a.r:a.x+a.w/2, sy=a.y, ex=b.r?b.x-b.r:b.x-b.w/2, ey=b.y;
    var dx=(ex-sx)*0.5;
    var d="M"+sx+","+sy+" C"+(sx+dx)+","+sy+" "+(ex-dx)+","+ey+" "+ex+","+ey;
    var id="l"+k, p=el("path",{d:d,id:id,class:"link"},gL);
    var len=p.getTotalLength(),n=Math.max(1,Math.round(len/170)),dur=(len/90).toFixed(2),dots=[];
    for(var i=0;i<n;i++){
      var c=el("circle",{r:3.4,fill:"#fff",filter:"url(#glow)"},gD);
      var m=el("animateMotion",{dur:dur+"s",repeatCount:"indefinite",begin:(-i*dur/n)+"s"},c);
      el("mpath",{href:"#"+id},m);dots.push(c);
    }
    links.push({p:p,dots:dots,a:l[0],b:l[1]});
  });
  var nodes={};
  N.forEach(function(n){
    var g=el("g",{class:"node","data-id":n.id,transform:"translate("+(n.x-n.w/2)+","+(n.y-n.h/2)+")"},gN);
    el("rect",{width:n.w,height:n.h,rx:14},g);
    var t=el("text",{class:"t",x:n.w/2,y:n.h/2-2,"text-anchor":"middle"},g);t.textContent=n.t;
    var s=el("text",{class:"s",x:n.w/2,y:n.h/2+18,"text-anchor":"middle"},g);s.textContent=n.s;
    nodes[n.id]=g;
  });
  nodes.core=document.getElementById("hub");
  var gT=document.getElementById("trust");
  T.forEach(function(t,i){
    var x=60+i*295;
    el("circle",{cx:x+5,cy:646,r:3.5,fill:"#fff"},gT);
    var tx=el("text",{x:x+18,y:651,"font-size":13.5,fill:"#fff","fill-opacity":.8},gT);tx.textContent=t;
  });
  var cap=document.getElementById("cap"),DEF=cap.textContent;
  function focus(id){
    var rel={};rel[id]=1;
    function up(i){links.forEach(function(q){if(q.b===i&&!rel[q.a]){rel[q.a]=1;up(q.a)}})}
    function down(i){links.forEach(function(q){if(q.a===i&&!rel[q.b]){rel[q.b]=1;down(q.b)}})}
    up(id);down(id);
    links.forEach(function(q){var on=rel[q.a]&&rel[q.b];q.p.classList.toggle("on",!!on);q.p.classList.toggle("dim",!on);q.dots.forEach(function(c){c.style.opacity=on?1:.1})});
    for(var k in nodes)nodes[k].classList.toggle("dim",!rel[k]);
    var n=by[id];cap.textContent=(n.t?n.t+": ":"")+n.i;
  }
  function clear(){
    links.forEach(function(q){q.p.classList.remove("on","dim");q.dots.forEach(function(c){c.style.opacity=1})});
    for(var k in nodes)nodes[k].classList.remove("dim");
    cap.textContent=DEF;
  }
  for(var k in nodes){(function(id){
    nodes[id].addEventListener("mouseenter",function(){focus(id)});
    nodes[id].addEventListener("mouseleave",clear);
    nodes[id].addEventListener("click",function(){focus(id)});
  })(k)}
})();
</script>
</body>
</html>
