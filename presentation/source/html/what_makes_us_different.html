<div class="pg">22</div>
<script>
const items = [
 ['scale','Age-aware routing','Under 18: a model for academic support, plain rules for dropout and fees. 18 and over: full model with their own consent.',['Under 18','Model: academic','Rules: dropout, fees']],
 ['check','Parent reports that are checked','Every number and topic is verified in code. If any check fails, a human-written template is sent instead.',['20 templates','8 checks']],
 ['key','Wrong answer-key detector','A question the strongest students get wrong is flagged as a likely wrong key, with a suggested correction.',['suspect key','re-score in one click']],
 ['range','Honest percentile ranges','A band that narrows as tests accumulate, with a disclaimer. Never a single number, never a rank promise.',['narrows with data','editable NTA table']],
 ['users','Strong with small batches','Question difficulty comes from a pooled bank across institutes, so a batch of 60 students is enough.',['Shared item bank','~Result pending~']],
 ['laptop','Runs on one laptop, free','Local database, local small models, no paid services. Works with the network unplugged.',['₹0 marginal','Local model','Offline']],
 ['shield','Compliance built in','Age check at enrolment, no test the day after the weekly off, pro-rata refund calculator, consent ledger, register exports.',['Age check','Test-day rule','Refunds','Consent ledger']],
 ['flask','Tested in the open','Public datasets, a held-out test, an independent attack on the report checker, and every miss reported.',['OULAD 0.706','ASSISTments 0.763','Misses listed']]
];
const IC = {
 scale:'<path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/>',

};
document.getElementById('g').innerHTML = items.map((it,i)=>`<div class="card"><div class="hd"><span class="n">0${i+1}</span><h3>${it[1]}</h3></div><div class="bd"><div class="ic"><svg viewBox="0 0 24 24">${IC[it[0]]}</svg></div><p>${it[2]}</p><div class="chips">${it[3].map((c,k)=>{const w=c.startsWith('~');return `<span class="chip2 ${w?'warn':k==0?'hot':''}">${c.replace(/~/g,'')}</span>`}).join('')}</div></div></div>`).join('');
