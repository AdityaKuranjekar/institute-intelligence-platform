<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What makes us different</title>
<link rel="stylesheet" href="ui.css">
<style>
body { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #fff; }
.blob { position: absolute; border-radius: 50%; z-index: 0; }
h1.t { position: absolute; top: 34px; left: 70px; margin: 0; font: 800 46px "Segoe UI"; color: var(--navy); z-index: 2; }
.sub { position: absolute; top: 96px; left: 72px; font: 600 18px "Segoe UI"; color: var(--muted); z-index: 2; }
.grid { position: absolute; left: 70px; right: 70px; top: 160px; bottom: 56px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 26px 24px; z-index: 2; }
.card { border-radius: 22px; background: var(--ct); position: relative; padding: 24px 24px 20px; display: flex; flex-direction: column; border: 2.5px solid var(--c); }
.card .n { position: absolute; right: 18px; top: 8px; font: 800 76px "Segoe UI"; color: var(--c); opacity: .22; line-height: 1; }
.card .ic { width: 66px; height: 66px; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: 0 0 0 7px #fff; }
.card .ic svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.y .ic svg { stroke: var(--navy); }
.card h3 { margin: 18px 0 8px; font: 800 27px "Segoe UI"; color: var(--navy); line-height: 1.15; }
.card p { margin: 0; font-size: 20px; line-height: 1.38; color: var(--ink); }
.card .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
.chip2 { background: #fff; border: 1.5px solid var(--c); color: var(--cd); border-radius: 999px; font: 700 13.5px "Segoe UI"; padding: 4px 11px; }
.chip2.hot { background: var(--c); color: #fff; } .y .chip2.hot { color: var(--navy); }
.g { --c:#1FA971; --cd:#0E7C4F; --ct:#E9F7EF; } .o { --c:#F28C28; --cd:#B85B07; --ct:#FFF1E2; } .b { --c:#2F80D1; --cd:#1F63A8; --ct:#EAF3FC; } .y { --c:#F7B500; --cd:#7A5900; --ct:#FFF7DC; }
</style></head><body>
<div class="blob" style="right:-200px;top:-220px;width:560px;height:560px;background:#E3EEFB"></div>
<div class="blob" style="left:-220px;bottom:-240px;width:560px;height:560px;background:#FFF1DC"></div>
<h1 class="t">What makes Pragati different</h1>
<div class="sub">Built for coaching institutes, not for demos</div>
<div class="grid" id="g"></div>
<script>
const items = [
 ['g','scale','Age-aware routing','Under 18: a model for academic support, plain rules for dropout and fees. 18 and over: full model with their own consent.',['Under 18','Model: academic','Rules: dropout, fees']],
 ['o','check','Parent reports that are checked','Every number and topic is verified in code. If any check fails, a human-written template is sent instead.',['20 templates','8 checks']],
 ['b','key','Wrong answer-key detector','A question the strongest students get wrong is flagged as a likely wrong key, with a suggested correction.',['suspect key','re-score in one click']],
 ['y','range','Honest percentile ranges','A band that narrows as tests accumulate, with a disclaimer. Never a single number, never a rank promise.',['narrows with data','editable NTA table']],
 ['y','users','Strong with small batches','Question difficulty comes from a pooled bank across institutes, so a batch of 60 students is enough.',['Shared item bank','Result pending']],
 ['b','laptop','Runs on one laptop, free','Local database, local small models, no paid services. Works with the network unplugged.',['₹0 marginal','Local model','Offline']],
 ['g','shield','Compliance built in','Age check at enrolment, no test the day after the weekly off, pro-rata refund calculator, consent ledger, register exports.',['Age check','Test-day rule','Refunds','Consent ledger']],
 ['o','flask','Tested in the open','Public datasets, a held-out test, an independent attack on the report checker, and every miss reported.',['OULAD 0.706','ASSISTments 0.763','Misses listed']]
];
const IC = {
 scale:'<path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/>',
 check:'<path d="M20 6 9 17l-5-5"/><rect x="2" y="2" width="20" height="20" rx="4"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 21 2M16 7l3 3M14 9l2 2"/>',
 range:'<path d="M3 20h18M7 20V9M12 20V4M17 20v-8"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 laptop:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>'
};
document.getElementById('g').innerHTML = items.map((it,i)=>`<div class="card ${it[0]}"><div class="n">0${i+1}</div><div class="ic"><svg viewBox="0 0 24 24">${IC[it[1]]}</svg></div><h3>${it[2]}</h3><p>${it[3]}</p><div class="chips">${it[4].map((c,k)=>`<span class="chip2 ${k==0?'hot':''}">${c}</span>`).join('')}</div></div>`).join('');
</script></body></html>
