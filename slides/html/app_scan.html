<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scan app</title><link rel="stylesheet" href="ui.css">
<style>
body { width: 410px; height: 820px; background: transparent; margin: 0; }
.phone { margin: 5px; background: #1E2B25; }
.phone .status { color: #fff; }
.cam { position: absolute; left: 0; right: 0; top: 44px; bottom: 250px; background: radial-gradient(circle at 50% 40%, #46524B, #26302B); overflow: hidden; }
.sheet { position: absolute; left: 36px; right: 36px; top: 34px; bottom: 30px; background: #FBFAF4; transform: rotate(-2.5deg); border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.4); padding: 14px 14px; }
.sheet h4 { margin: 0 0 6px 24px; font: 700 10px "Segoe UI"; color: #444; letter-spacing: .05em; }
.sheet .qr { position: absolute; right: 12px; top: 10px; width: 34px; height: 34px; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0/8px 8px; }
.bub { display: grid; grid-template-columns: 22px repeat(4, 28px); justify-content: center; gap: 5px 10px; margin-top: 34px; font: 600 8.5px "Segoe UI"; color: #555; align-items: center; }
.bub i { width: 11px; height: 11px; border-radius: 50%; border: 1.3px solid #666; display: inline-block; justify-self: center; }
.bub i.f { background: #222; } .bub i.u { background: #F28C28; border-color: #F28C28; }
.mark { position: absolute; width: 22px; height: 22px; background: #1FA971; }
.mark.a { left: 6px; top: 6px; } .mark.b { right: 6px; top: 6px; } .mark.c { left: 6px; bottom: 6px; } .mark.d { right: 6px; bottom: 6px; }
.frame { position: absolute; left: 22px; right: 22px; top: 22px; bottom: 18px; border: 3px solid #5BE0A4; border-radius: 14px; box-shadow: 0 0 0 600px rgba(0,0,0,.18); }
.ok { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #1FA971; color: #fff; font: 700 12px "Segoe UI"; padding: 5px 14px; border-radius: 999px; white-space: nowrap; z-index: 4; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: 255px; background: #fff; border-radius: 26px 26px 0 0; padding: 16px 20px; }
.panel h3 { margin: 0; font: 800 18px "Segoe UI"; color: var(--navy); }
.panel .p { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.bar2 { height: 10px; border-radius: 6px; background: #EEF1EE; overflow: hidden; } .bar2 i { display:block; height:100%; width:96%; background: #1FA971; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.row div { flex: 1; border-radius: 12px; padding: 8px 10px; font-size: 12px; font-weight: 600; background: var(--tint); }
.row b { display: block; font: 800 20px "Segoe UI"; }
.btn { margin-top: 12px; text-align: center; background: #F28C28; color: #fff; padding: 12px; border-radius: 14px; font: 800 15px "Segoe UI"; }
</style></head><body>
<div class="phone"><div class="notch"></div>
  <div class="status"><span>9:41</span><span>● ● ▮</span></div>
  <div class="cam">
    <div class="ok">Test 12 found · Chemistry · Batch JEE-11A</div>
    <div class="sheet">
      <div class="mark a"></div><div class="mark b"></div><div class="mark c"></div><div class="mark d"></div><div class="qr"></div>
      <h4>OMR ANSWER SHEET · ROLL 142</h4>
      <div class="bub" id="b"></div>
    </div>
    <div class="frame"></div>
  </div>
  <div class="panel">
    <h3>48 of 50 answers read</h3><div class="p">2 bubbles are unclear. Tap to confirm, nothing is saved yet.</div>
    <div class="bar2"><i></i></div>
    <div class="row"><div><b>Q12</b>unclear: B or C</div><div><b>Q33</b>two marks</div><div><b>2.1 s</b>on this laptop</div></div>
    <div class="btn">Fix 2 and save</div>
  </div>
</div>
<script>
let h='';const pat=[0,2,1,3,1,0,2,2,3,1,0,3,2,1,0,3,1,1,2,0,3,2,1,0,2];
for(let q=0;q<22;q++){h+=`<span>${q+1}</span>`;for(let o=0;o<4;o++){const f=pat[q]===o;const u=(q===11&&(o===1||o===2));h+=`<i class="${u?'u':f?'f':''}"></i>`;}}
document.getElementById('b').innerHTML=h;
</script></body></html>
