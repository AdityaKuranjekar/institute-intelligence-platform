# DRAFT synthetic generator config — calibrated from research R4/R5 (2026-10-20)
# Moves to datamoat/datagen/config/generator_config.yaml once contracts are frozen.
# confidence: high = official source, med = report/aggregator, low = blog/inferred, assumption = ours
seed: 42
academic_year_start: "2026-04-15"
months_simulated: 12

institutes:          # sizes span the realistic range; profile drives base rates
  - {id: patna_jee,    city: Patna,    tier: 2, exam: JEE,  students: 400}
  - {id: lucknow_neet, city: Lucknow,  tier: 2, exam: NEET, students: 900}
  - {id: smalltown_mix,city: Gaya,     tier: 3, exam: MIX,  students: 150}
  - {id: kota_large,   city: Kota,     tier: 2, exam: JEE,  students: 2000}

students:
  class_mix: {class_11: 0.30, class_12: 0.30, dropper: 0.40}   # low: "inferred" (R4)
  batch_size: [40, 80]                                         # low: directory listing (R4)
  batch_assignment: admission_order                            # high: MoE cl. 12(vii) — never by performance
  batch_change_rate: 0.03                                      # assumption: non-performance transfers only
  min_age_at_enrolment: 16                                     # high: MoE 2024 guidelines
  age_by_class: {class_11: [16, 17], class_12: [17, 18], dropper: [18, 20]}   # assumption
  gender_ratio_female: {JEE: 0.30, NEET: 0.55}                 # assumption — verify

exam_patterns:      # moves to contracts/exam_patterns.yaml
  JEE_MAIN_2026:
    subjects: [Physics, Chemistry, Mathematics]
    per_subject: {mcq_4opt: 20, numeric: 5}
    marking: {correct: 4, wrong: -1, blank: 0, numeric_wrong: -1}  # high: NTA notice Jan 2026
    duration_min: 180
  NEET_UG_2026:
    verified: false   # bulletin PDF not yet checked (R4b NOT FOUND) — manual check pending
    default_variant: compulsory_180
    variants:
      compulsory_180: {per_subject: {mcq_4opt: 45}, attempt_all: true, max_marks: 720, duration_min: 180}   # our belief: 2025 reform
      sectioned_200:  {per_subject: {section_a: 35, section_b: 15, section_b_attempt: 10}, max_marks: 720, duration_min: 200}  # R4 (2019–2022 notices)
    subjects: [Physics, Chemistry, Botany, Zoology]
    marking: {correct: 4, wrong: -1, blank: 0}
  dropped_question_rule: full_marks_all        # high: NTA
  multi_correct_rule: full_marks_if_any_accepted

tests:
  full_mock_every_days: 14                     # med: inferred
  chapter_test_every_days: 7                   # assumption
  chapter_test_questions: [20, 30]             # assumption
  weekly_off_day: Sunday                       # high: MoE (weekly off mandatory)
  no_test_day_after_off: true                  # high: MoE

fees:
  annual_inr: {tier2: [80000, 150000], tier3: [60000, 100000]}   # med: R4 range, split is assumption
  upfront_share: 0.35                          # med: inferred
  instalments_after_upfront: 2                 # med (R4, inferred)
  rajasthan_profile: {equal_instalments: 4, upfront_share: 0.25}   # high: Rajasthan Act 16/2025 s.6(2)(e) (option for parents)
  instalment_gap_months: 3
  late_or_default_final_instalment: [0.15, 0.20]   # med
  refund_on_withdrawal: pro_rata_within_10_days    # high: MoE 2024

attendance:
  base_rate: 0.82                              # med: inferred
  festival_dip: {months: [10, 11], multiplier: 0.60, applies_to: out_of_town}   # med
  board_exam_dip: {months: [1, 2], multiplier: 0.70, applies_to: class_12}       # med (multiplier = assumption)
  pre_dropout_fade_weeks: [3, 8]               # assumption (signal for gradual dropouts)

dropout:
  annual_rate: 0.18                            # med: R4 15–25 %; knob range [0.12, 0.25]
  peak_months: [3, 4]                          # med (Aug–Sep)
  dropper_hazard_multiplier: 0.7               # med: sunk-cost argument (R4), value = assumption
  sudden_share: 0.25                           # assumption — the unpredictable ceiling
  reasons_mix: {academic_gap: 0.35, financial: 0.20, homesick_relocation: 0.20, switched_institute: 0.15, health_other: 0.10}   # assumption

irt_truth:
  a: {dist: lognormal, mu: 0.0, sigma: 0.3}
  b: {dist: normal, mean: topic_mean, sd: 1.0}
  guess_mcq: {dist: beta, alpha: 2, beta: 18}  # optional guessing under negative marking
  blank_policy: risk_averse_threshold          # student-level parameter → MNAR blanks

outcomes:
  percentile_table: contracts/percentile_tables.csv   # low: aggregator/blog data, editable assumption
  shift_difficulty_sd_marks: 20                # med: R4 says ±15–30

messy:
  institute_scanner_error_rate: [0.02, 0.04]   # low (R4)
  wrong_answer_keys_per_100_items: 1.5         # assumption
scenario_knobs: [dropout_multiplier, marks_only_share, online_test_share, upfront_full_fee_share, missing_rate, institute_size]
