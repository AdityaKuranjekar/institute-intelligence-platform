# Extra verifier lexicon (outside contracts/; see CCR-010: move into contracts/reason_templates.yaml in v1.0.1).
# Matching rules (verifier.py):
#   en: regular expressions (case-insensitive) run on NFKC-lowercased text with '-', '_' collapsed to spaces.
#   hi: literal strings; folded (NFKC, nukta removed, chandrabindu -> anusvara) on both sides; matched at a word START
#       (so inflections such as चिंतित, चिंताजनक, छोड़ने are caught) but not inside another Devanagari word.
#   Both language lists are applied to BOTH report languages (transliterations and mixed-script tricks).
