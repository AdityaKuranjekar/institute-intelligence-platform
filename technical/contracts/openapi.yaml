# Purpose: OpenAPI 3.1 specification for all DataMoat backend endpoints, RBAC role filtering, JWT claims, and RFC 7807 errors.
# contract_version: 1.0.0
# Implements: TECH_PLAN §12 (Data capture), §13 (API), §14 (Prototype scope), and §15 (Privacy & DPDP).

openapi: 3.1.0
info:
  title: DataMoat Institute Intelligence API
  version: 1.0.0
  summary: Local-first, DPDP-compliant Institute Intelligence Platform API for JEE/NEET coaching institutes.
  description: 'OpenAPI 3.1 contract for DataMoat (`contract_version: 1.0.0`).


    ### Authentication & Multi-Tenancy

    - Bearer JWT authentication (`Authorization: Bearer <token>`).

    - Required JWT claims: `sub` (UUID of user), `institute_id` (UUID of tenant), `role` (`owner|admin|teacher|mentor|parent|student`).

    - Tenant isolation is enforced strictly from the JWT `institute_id` claim + PostgreSQL Row-Level Security (`app.institute_id`),
    never from request bodies.


    ### Rate Limits & Upload Limits

    - Standard API endpoints: 120 requests/minute per user.

    - Report generation (`POST /students/{id}/reports`): 20 requests/minute.

    - Multipart uploads: 15 MB for `/ingest/students`, 25 MB for `/ingest/results`, 50 MB for `/ingest/omr`.'
servers:
- url: http://localhost:8000
  description: Local offline docker-compose FastAPI server
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Local HS256 JWT containing claims: `sub` (user UUID), `institute_id` (tenant UUID), `role` (`owner|admin|teacher|mentor|parent|student`).'
  schemas:
    role_enum:
      type: string
      description: User role within an institute controlling RBAC and response field filtering.
      enum:
      - owner
      - admin
      - teacher
      - mentor
      - parent
      - student
    class_level_enum:
      type: string
      description: Student academic cohort or class level.
      enum:
      - class_11
      - class_12
      - dropper
    exam_enum:
      type: string
      description: Target competitive entrance examination.
      enum:
      - jee_main
      - neet_ug
    institute_exam_focus_enum:
      type: string
      description: Primary entrance exam focus of a coaching institute.
      enum:
      - jee_main
      - neet_ug
      - mix
    city_tier_enum:
      type: string
      description: Indian urban tier classification of the institute's city.
      enum:
      - tier_1
      - tier_2
      - tier_3
    institute_plan_enum:
      type: string
      description: Subscription plan tier of the coaching institute.
      enum:
      - starter
      - standard
      - pro
    student_status_enum:
      type: string
      description: Current enrolment lifecycle status of a student.
      enum:
      - active
      - left
      - transferred
    gender_enum:
      type: string
      description: Student gender for fairness slice reporting.
      enum:
      - female
      - male
      - other
      - prefer_not_to_say
    fee_plan_enum:
      type: string
      description: Tuition fee payment schedule plan chosen at admission.
      enum:
      - upfront_full
      - standard_3_instalment
      - rajasthan_4_equal
      - custom_scholarship
    guardian_relation_enum:
      type: string
      description: Relationship of the consenting adult guardian to the student.
      enum:
      - father
      - mother
      - legal_guardian
      - self
    response_status_enum:
      type: string
      description: Capture and grading state of an individual question response.
      enum:
      - answered
      - blank
      - multi_marked
      - unreadable
    q_type_enum:
      type: string
      description: Question format type.
      enum:
      - mcq_single
      - mcq_multi
      - numeric
    partial_rule_enum:
      type: string
      description: Rule for awarding marks on multi-correct or dropped questions.
      enum:
      - none
      - full_marks_if_any_accepted
      - proportional_no_negative
    dropped_question_rule_enum:
      type: string
      description: Scoring policy when an item is officially dropped from a test.
      enum:
      - full_marks_all
      - full_marks_attempted_only
    test_source_enum:
      type: string
      description: Data ingestion channel through which test responses or marks arrived.
      enum:
      - omr
      - csv
      - online
    attendance_source_enum:
      type: string
      description: Source channel for daily student attendance records.
      enum:
      - csv
      - manual
      - biometric
    consent_purpose_enum:
      type: string
      description: Granular DPDP Act processing purpose requiring verifiable consent.
      enum:
      - analytics
      - risk_alerts
      - parent_reports
      - benchmarking
      - engagement_tracking
    verification_method_enum:
      type: string
      description: DPDP Rule 10 identity and age verification method for consent.
      enum:
      - in_person_id_check
      - otp_known_parent
      - digilocker_token
      - self_adult
    intervention_type_enum:
      type: string
      description: Supportive mentor action triggered by an early-warning alert.
      enum:
      - mentoring
      - counselling_referral
      - remedial_session
      - fee_plan_discussion
      - parent_call
    intervention_outcome_enum:
      type: string
      description: Logged outcome of a completed supportive intervention.
      enum:
      - pending
      - completed_improved
      - completed_no_change
      - escalated_to_counsellor
      - parent_unreachable
      - declined
    risk_target_enum:
      type: string
      description: Early-warning prediction or rule evaluation target.
      enum:
      - academic_support
      - retention
      - fee
    risk_band_enum:
      type: string
      description: Supportive triage band assigned to a student.
      enum:
      - low
      - watch
      - needs_support
    mastery_band_enum:
      type: string
      description: Categorical topic mastery band displayed when standard error is sufficiently small.
      enum:
      - not_enough_data
      - building
      - steady
      - strong
    trend_direction_enum:
      type: string
      description: Overall academic trajectory direction over the reporting window.
      enum:
      - improving
      - steady
      - declining
    feature_tier_enum:
      type: string
      description: Privacy tier classification of model features (A=tests, B=attendance, C=fees, D=engagement).
      enum:
      - A
      - B
      - C
      - D
    batch_change_reason_enum:
      type: string
      description: Permitted administrative reason for transferring a student between batches (performance is deliberately
        absent per MoE cl. 12(vii)).
      enum:
      - timing
      - subject_change
      - relocation
      - other
    ingest_type_enum:
      type: string
      description: Category of data uploaded in an ingestion job.
      enum:
      - students
      - guardians
      - results_responses
      - results_marks_only
      - answer_key
      - attendance
      - fees
      - omr_photos
    ingest_status_enum:
      type: string
      description: Processing status of an upload ingestion job.
      enum:
      - pending_mapping
      - preview_ready
      - awaiting_review
      - confirmed
      - failed
    report_path_enum:
      type: string
      description: Generation pathway used to produce a verified parent report.
      enum:
      - llm
      - template
    report_channel_enum:
      type: string
      description: Delivery channel for parent progress reports.
      enum:
      - none
      - whatsapp_preview
      - pdf_download
      - portal_view
    lang_enum:
      type: string
      description: ISO 639-1 language code supported by user interfaces and templates.
      enum:
      - en
      - hi
    tagger_source_enum:
      type: string
      description: Origin of a question-to-topic mapping tag.
      enum:
      - human
      - embedding_llm
      - keyword_rule
    item_fit_flag_enum:
      type: string
      description: IRT calibration diagnostic flag for a question item.
      enum:
      - ok
      - suspect_wrong_key
      - low_discrimination
      - too_few_responses
    day_of_week_enum:
      type: string
      description: Day of the week in Asia/Kolkata calendar.
      enum:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    routing_method_enum:
      type: string
      description: Execution method permitted by purpose- and age-aware legal routing.
      enum:
      - ml
      - rules
      - none
    audit_action_enum:
      type: string
      description: Audited security or privacy event type (retained >= 1 year per DPDP Rule 6).
      enum:
      - view_risk_scores
      - view_student_profile
      - export_register
      - update_legal_settings
      - update_privacy_tier
      - grant_consent
      - revoke_consent
      - update_answer_key
      - create_intervention
      - generate_report
    problem:
      type: object
      description: RFC 7807 Problem Details error response.
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    login_request:
      type: object
      required:
      - phone
      - role_override
      properties:
        phone:
          type: string
        institute_id:
          type: string
          format: uuid
        role_override:
          $ref: '#/components/schemas/role_enum'
    auth_token_response:
      type: object
      required:
      - access_token
      - token_type
      - claims
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        claims:
          type: object
          required:
          - sub
          - institute_id
          - role
          - exp
          properties:
            sub:
              type: string
              format: uuid
            institute_id:
              type: string
              format: uuid
            role:
              $ref: '#/components/schemas/role_enum'
            exp:
              type: integer
    user_profile:
      type: object
      required:
      - id
      - institute_id
      - role
      - name
      - phone
      - lang
      - city_tier
      - exam_focus
      - plan
      - weekly_off_day
      properties:
        id:
          type: string
          format: uuid
        institute_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/role_enum'
        name:
          type: string
        phone:
          type: string
        lang:
          $ref: '#/components/schemas/lang_enum'
        city_tier:
          $ref: '#/components/schemas/city_tier_enum'
        exam_focus:
          $ref: '#/components/schemas/institute_exam_focus_enum'
        plan:
          $ref: '#/components/schemas/institute_plan_enum'
        weekly_off_day:
          $ref: '#/components/schemas/day_of_week_enum'
    ingest_job_response:
      type: object
      required:
      - id
      - institute_id
      - file_hash
      - type
      - status
      - rows_ok
      - rows_failed
      - errors
      properties:
        id:
          type: string
          format: uuid
        institute_id:
          type: string
          format: uuid
        file_hash:
          type: string
        type:
          $ref: '#/components/schemas/ingest_type_enum'
        status:
          $ref: '#/components/schemas/ingest_status_enum'
        rows_ok:
          type: integer
        rows_failed:
          type: integer
        mapping:
          type: object
          additionalProperties:
            type: string
        compliance_warnings:
          type: array
          items:
            type: string
          description: Age < 16 at enrolment or test-day-after-weekly-off warnings per MoE 2024 guidelines.
        errors:
          type: array
          items:
            type: object
            required:
            - row_no
            - column
            - message
            properties:
              row_no:
                type: integer
              column:
                type: string
              message:
                type: string
    omr_cell_review:
      type: object
      required:
      - question_no
      - q_type
      - detected_response
      - status
      - confidence
      properties:
        question_no:
          type: integer
        q_type:
          $ref: '#/components/schemas/q_type_enum'
        detected_response:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/response_status_enum'
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
    omr_ingest_response:
      type: object
      required:
      - job_id
      - status
      - test_id
      - sheets
      - model_version
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ingest_status_enum'
        test_id:
          type: string
          format: uuid
        model_version:
          type: string
        sheets:
          type: array
          items:
            type: object
            required:
            - image_name
            - roll_no
            - low_confidence_cells
            properties:
              image_name:
                type: string
              roll_no:
                type: string
              low_confidence_cells:
                type: array
                items:
                  $ref: '#/components/schemas/omr_cell_review'
    omr_confirm_request:
      type: object
      required:
      - corrections
      properties:
        corrections:
          type: array
          items:
            type: object
            required:
            - roll_no
            - question_no
            - confirmed_response
            - status
            properties:
              roll_no:
                type: string
              question_no:
                type: integer
              confirmed_response:
                type:
                - string
                - 'null'
              status:
                $ref: '#/components/schemas/response_status_enum'
    batch_heatmap_response:
      type: object
      required:
      - batch_id
      - exam
      - class_level
      - model_version
      - topics
      - cells
      properties:
        batch_id:
          type: string
          format: uuid
        exam:
          $ref: '#/components/schemas/exam_enum'
        class_level:
          $ref: '#/components/schemas/class_level_enum'
        model_version:
          type: string
        next_cursor:
          type:
          - string
          - 'null'
        topics:
          type: array
          items:
            type: object
            required:
            - topic_id
            - name_en
            - name_hi
            - probably_untaught
            properties:
              topic_id:
                type: string
              name_en:
                type: string
              name_hi:
                type: string
              probably_untaught:
                type: boolean
        cells:
          type: array
          items:
            type: object
            required:
            - student_id
            - roll_no
            - student_name
            - topic_id
            - theta
            - se
            - band
            properties:
              student_id:
                type: string
                format: uuid
              roll_no:
                type: string
              student_name:
                type: string
              topic_id:
                type: string
              theta:
                type: number
              se:
                type: number
              band:
                $ref: '#/components/schemas/mastery_band_enum'
    support_reason_item:
      type: object
      required:
      - reason_template_key
      - text_en
      - text_hi
      - suggested_action
      - action_text_en
      - action_text_hi
      properties:
        reason_template_key:
          type: string
        text_en:
          type: string
        text_hi:
          type: string
        suggested_action:
          $ref: '#/components/schemas/intervention_type_enum'
        action_text_en:
          type: string
        action_text_hi:
          type: string
    support_list_response:
      type: object
      required:
      - batch_id
      - week
      - mentor_capacity_per_week
      - model_version
      - students
      properties:
        batch_id:
          type: string
          format: uuid
        week:
          type: string
        mentor_capacity_per_week:
          type: integer
        model_version:
          type: string
        next_cursor:
          type:
          - string
          - 'null'
        students:
          type: array
          items:
            type: object
            required:
            - student_id
            - roll_no
            - name
            - is_minor
            - target
            - routing_method
            - band
            - feature_tier
            - reasons
            properties:
              student_id:
                type: string
                format: uuid
              roll_no:
                type: string
              name:
                type: string
              is_minor:
                type: boolean
              target:
                $ref: '#/components/schemas/risk_target_enum'
              routing_method:
                $ref: '#/components/schemas/routing_method_enum'
              p:
                type:
                - number
                - 'null'
              band:
                $ref: '#/components/schemas/risk_band_enum'
              feature_tier:
                $ref: '#/components/schemas/feature_tier_enum'
              reasons:
                type: array
                items:
                  $ref: '#/components/schemas/support_reason_item'
    batch_summary_response:
      type: object
      required:
      - batch_id
      - name
      - class_level
      - exam
      - enrolled_count
      - published_capacity
      - mean_attendance_28d
      - needs_support_count
      - model_version
      properties:
        batch_id:
          type: string
          format: uuid
        name:
          type: string
        class_level:
          $ref: '#/components/schemas/class_level_enum'
        exam:
          $ref: '#/components/schemas/exam_enum'
        enrolled_count:
          type: integer
        published_capacity:
          type: integer
        mean_attendance_28d:
          type: number
        needs_support_count:
          type: integer
        model_version:
          type: string
    student_profile_response:
      type: object
      description: Role-filtered student profile. Parents/students see only mastery, trend, and percentile_band (risk_summary
        is omitted/null for parent and student roles). For under-18 minors, retention/fee entries in risk_summary follow routing_policy.yaml.
      required:
      - student_id
      - roll_no
      - name
      - gender
      - class_level
      - status
      - fee_plan
      - is_minor
      - trend
      - percentile_band
      - mastery
      - model_version
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
        name:
          type: string
        name_alt:
          type:
          - string
          - 'null'
        gender:
          $ref: '#/components/schemas/gender_enum'
        class_level:
          $ref: '#/components/schemas/class_level_enum'
        status:
          $ref: '#/components/schemas/student_status_enum'
        fee_plan:
          $ref: '#/components/schemas/fee_plan_enum'
        is_minor:
          type: boolean
        trend:
          $ref: '#/components/schemas/trend_direction_enum'
        model_version:
          type: string
        percentile_band:
          type: object
          required:
          - as_of
          - q10
          - q50
          - q90
          - mapped_low
          - mapped_high
          - coverage_level
          - disclaimer_en
          - disclaimer_hi
          properties:
            as_of:
              type: string
              format: date
            q10:
              type: number
            q50:
              type: number
            q90:
              type: number
            mapped_low:
              type: number
            mapped_high:
              type: number
            coverage_level:
              type: number
            disclaimer_en:
              type: string
            disclaimer_hi:
              type: string
        mastery:
          type: array
          items:
            type: object
            required:
            - topic_id
            - name_en
            - name_hi
            - theta
            - se
            - band
            properties:
              topic_id:
                type: string
              name_en:
                type: string
              name_hi:
                type: string
              theta:
                type: number
              se:
                type: number
              band:
                $ref: '#/components/schemas/mastery_band_enum'
        risk_summary:
          type:
          - array
          - 'null'
          description: Visible ONLY to owner, admin, mentor, and teacher roles; strictly null/omitted for parent and student
            roles.
          items:
            type: object
            required:
            - target
            - routing_method
            - band
            - feature_tier
            - reasons
            properties:
              target:
                $ref: '#/components/schemas/risk_target_enum'
              routing_method:
                $ref: '#/components/schemas/routing_method_enum'
              p:
                type:
                - number
                - 'null'
              band:
                $ref: '#/components/schemas/risk_band_enum'
              feature_tier:
                $ref: '#/components/schemas/feature_tier_enum'
              reasons:
                type: array
                items:
                  $ref: '#/components/schemas/support_reason_item'
        pro_rata_refund_estimate_paise:
          type:
          - integer
          - 'null'
          description: Computed 10-day pro-rata refund in paise if student withdraws (MoE 2024 cl. 8(iv)).
    attendance_patch_request:
      type: object
      required:
      - as_of
      - records
      properties:
        as_of:
          type: string
          format: date
        records:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - attendance_date
            - present_flag
            - source
            properties:
              attendance_date:
                type: string
                format: date
              present_flag:
                type: boolean
              source:
                $ref: '#/components/schemas/attendance_source_enum'
    fees_patch_request:
      type: object
      required:
      - as_of
      - instalments
      properties:
        as_of:
          type: string
          format: date
        instalments:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - instalment_no
            - due_date
            - amount_paise
            - paid_amount_paise
            properties:
              instalment_no:
                type: integer
                minimum: 1
              due_date:
                type: string
                format: date
              amount_paise:
                type: integer
                minimum: 0
              paid_date:
                type:
                - string
                - 'null'
                format: date
              paid_amount_paise:
                type: integer
                minimum: 0
    intervention_create_request:
      type: object
      required:
      - type
      - due_date
      properties:
        type:
          $ref: '#/components/schemas/intervention_type_enum'
        due_date:
          type: string
          format: date
        batch_change:
          type:
          - object
          - 'null'
          required:
          - to_batch
          - reason
          properties:
            to_batch:
              type: string
              format: uuid
            reason:
              $ref: '#/components/schemas/batch_change_reason_enum'
    intervention_patch_request:
      type: object
      required:
      - outcome
      properties:
        done_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/intervention_outcome_enum'
    intervention_response:
      type: object
      required:
      - id
      - student_id
      - type
      - owner_user_id
      - due_date
      - outcome
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/intervention_type_enum'
        owner_user_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
        done_at:
          type:
          - string
          - 'null'
          format: date-time
        outcome:
          $ref: '#/components/schemas/intervention_outcome_enum'
    report_generate_response:
      type: object
      required:
      - id
      - student_id
      - period
      - lang
      - content
      - verified
      - path
      - sent_via
      - model_version
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        period:
          type: string
        lang:
          $ref: '#/components/schemas/lang_enum'
        content:
          type: string
        verified:
          type: boolean
        path:
          $ref: '#/components/schemas/report_path_enum'
        sent_via:
          $ref: '#/components/schemas/report_channel_enum'
        model_version:
          type: string
    flagged_questions_response:
      type: object
      required:
      - test_id
      - model_version
      - items
      properties:
        test_id:
          type: string
          format: uuid
        model_version:
          type: string
        items:
          type: array
          items:
            type: object
            required:
            - question_id
            - position
            - q_type
            - fit_flag
            - a
            - b
            - se_b
            - n_responses
            - tagged_by
            - current_accepted_answers
            - dropped
            properties:
              question_id:
                type: string
                format: uuid
              position:
                type: integer
              q_type:
